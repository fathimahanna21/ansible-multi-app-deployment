---
- name: Install Node.js
  ansible.builtin.apt:
    name:
      - nodejs
    state: present
    update_cache: true

- name: Create Node.js application user
  ansible.builtin.user:
    name: "{{ node_app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create Node.js application directory
  ansible.builtin.file:
    path: "{{ node_app_dir }}"
    state: directory
    owner: "{{ node_app_user }}"
    group: "{{ node_app_user }}"
    mode: '0755'

- name: Copy Node.js application
  ansible.builtin.copy:
    src: app.js
    dest: "{{ node_app_dir }}/app.js"
    owner: "{{ node_app_user }}"
    group: "{{ node_app_user }}"
    mode: '0644'
  notify: Restart Node.js

- name: Copy Node.js package file
  ansible.builtin.copy:
    src: package.json
    dest: "{{ node_app_dir }}/package.json"
    owner: "{{ node_app_user }}"
    group: "{{ node_app_user }}"
    mode: '0644'

- name: Deploy Node.js systemd service
  ansible.builtin.template:
    src: node.service.j2
    dest: /etc/systemd/system/node_app.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart Node.js

- name: Enable and start Node.js application
  ansible.builtin.systemd:
    name: node_app
    enabled: true
    state: started
    daemon_reload: true
