---
- name: Install Nginx
  ansible.builtin.apt:
    name: "{{ nginx_package }}"
    state: present
    update_cache: true

- name: Ensure Nginx is running and enabled
  ansible.builtin.service:
    name: "{{ nginx_service }}"
    state: started
    enabled: true

- name: Deploy Nginx reverse proxy configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/multi-app
    owner: root
    group: root
    mode: '0644'
  notify: Restart Nginx

- name: Enable multi-app Nginx configuration
  ansible.builtin.file:
    src: /etc/nginx/sites-available/multi-app
    dest: /etc/nginx/sites-enabled/multi-app
    state: link
  notify: Restart Nginx

- name: Remove default Nginx configuration
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart Nginx

- name: Validate Nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
